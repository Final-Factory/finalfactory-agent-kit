name: release

# Tag vX.Y.Z (matching kit/VERSION) to publish AgentKit-X.Y.Z-win.zip and AgentKit-X.Y.Z-mac.zip,
# the asset names the game's scripts/fetch-agent-kit.sh downloads.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    # macOS for lipo: the mac binary is universal (arm64 + amd64).
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      - name: assemble the kits
        run: scripts/build-kit.sh --strict --expect-version "$GITHUB_REF_NAME"
      - name: publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" --verify-tag \
            --title "AgentKit ${version}" --generate-notes \
            "dist/AgentKit-${version}-win.zip" "dist/AgentKit-${version}-mac.zip"
